compiler_type = "mwcc"
compiler_command = '''export LM_LICENSE_FILE=tools/mwccarm/license.dat; tools/mwccarm/2.0/sp1p2/mwccarm.exe -proc arm946e -O4,p -ipa file -interworking -inline on -sym on -enum int -lang=c99 -Cpp_exceptions off -gccext,on -gccinc -msgstyle gcc -char signed -DSDK_ARM9 -D__arm=1 -D__MWERKS__=1 "-D__option(x)=__option_##x" -D__option_c99=1 -D__option_little_endian=1 -D__option_dont_inline=0 -D__option_wchar_type=1 -D__option_unsigned_char=0 -D__option_RTTI=0 -D__option_exceptions=0 -D__option_bool=1 -i arm9/include -i lib/nitro/include -i lib/NitroSDK/include -i lib/mw-libraries/ARM_EABI_Support_DS2.0/msl/MSL_C/MSL_Common/Include -i lib/mw-libraries/ARM_EABI_Support_DS2.0/msl/MSL_C/MSL_ARM/Include -include ansi_prefix.ARM.h -c'''
